[package]
name = "daily-app-usage-tracker"
version = "0.1.0"
description = "Local-only Windows foreground application usage tracker"
authors = ["Local User"]
edition = "2024"

[lib]
name = "daily_app_usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
chrono = { version = "0.4.41", features = ["clock", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["devtools", "image-png", "tray-icon"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2.3.6"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
tempfile = "3.21.0"

[profile.dev]
opt-level = 1

[profile.dev.package.image]
opt-level = 3
