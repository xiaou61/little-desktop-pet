schema: spec-driven

context: |
  产品：面向 Windows 的桌面宠物。桌宠是首要体验，软件使用统计是桌宠提供的第一个功能面板。
  目标平台：Windows 10/11 x64，要求系统已安装 WebView2。
  技术栈：Tauri 2、Rust、Svelte、TypeScript、Vite、Bun 和 SQLite。
  架构：Rust 负责 Windows 活动采集和数据持久化；桌宠窗口保持轻量，桌宠下方的快捷面板和完整统计面板按需创建。
  使用统计口径：只统计用户活跃时位于前台的软件。连续五分钟没有输入、锁屏或系统挂起时暂停统计。
  隐私：数据只保存在本地。不收集窗口标题、文档名、键盘内容、截图或网络活动；不发送遥测，也不做云同步。
  时间：时间戳使用 UTC 保存，并按照采集时的 Windows 本地日期进行每日汇总。
  质量：时间计算逻辑必须与 Win32 和 Tauri 适配层分离，以便使用确定性的自动化测试覆盖。

rules:
  proposal:
    - 明确写出非目标和隐私影响。
  specs:
    - 每条需求至少包含一个 GIVEN/WHEN/THEN 场景。
    - 明确空闲、锁屏/挂起、跨日和重启时的行为。
  design:
    - 解释资源占用方面的决策和考虑过的替代方案。
    - 定义持久化数据模型和故障恢复行为。
  tasks:
    - 任务应当可以独立验证，通常控制在两小时以内。
    - 必须包含自动化测试和一次 Windows 手工验证。

operations:
  apply:
    guidance:
      - 每完成一组实现就运行对应的聚焦测试。
      - 桌宠是主界面；不要把它降级为统计工具，也不要添加云同步、账号或遥测。
  archive:
    guidance:
      - 归档前运行严格校验。
